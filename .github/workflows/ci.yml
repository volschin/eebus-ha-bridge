name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

# A second push to a PR supersedes the first: keeping the older run alive only
# burns runner minutes on a diff nobody will merge. Runs on main are keyed by
# their own ref and cancel only each other, never a PR run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which paths changed so Go jobs can be skipped when irrelevant
  changes:
    runs-on: ubuntu-latest
    outputs:
      addon: ${{ steps.filter.outputs.addon }}
      go: ${{ steps.filter.outputs.go }}
      proto: ${{ steps.filter.outputs.proto }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            addon:
              - 'eebus-bridge-addon/**'
              - 'repository.yaml'
              - '.github/workflows/ci.yml'
            go:
              - 'eebus-bridge/**'
              - 'scripts/check_go_patch_coverage.py'
              - 'scripts/tests/test_check_go_patch_coverage.py'
              - 'scripts/smoke-image.sh'
              - 'docs/badges/go-coverage.svg'
              - '.github/workflows/ci.yml'
            python:
              - 'custom_components/**'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
            proto:
              - 'eebus-bridge/proto/**'
              - 'eebus-bridge/gen/proto/**'
              - 'custom_components/eebus/generated/**'
              - 'generate_proto.sh'
              - 'buf.yaml'
              - 'buf.gen.yaml'
              - 'proto-tools.env'
              - 'scripts/proto_*.py'
              - 'scripts/check_proto_*.py'
              - 'scripts/check_generated_drift.sh'
              - 'custom_components/eebus/proto_stubs.py'
              - 'custom_components/eebus/tests/test_proto_postprocess.py'
              - 'docs/proto-contract-matrix.md'

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eebus-bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: eebus-bridge/go.sum
      - run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0 # renovate: datasource=github-releases depName=golangci/golangci-lint-action
        with:
          working-directory: eebus-bridge
          version: v2.12.2
      - run: go test -v -race ./...
      - name: Test Go patch coverage checker
        run: python3 -m unittest discover -s ../scripts/tests -p 'test_check_go_patch_coverage.py' -v
      - name: Generate productive Go coverage
        run: go test -count=1 -coverprofile=coverage.out ./cmd/eebus-bridge ./cmd/eebus-watch ./internal/...
      - name: Enforce Go coverage
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          go tool cover -func=coverage.out | tee coverage-summary.txt
          read -r covered_statements total_statements <<< "$(awk 'NR > 1 {
            total += $2
            if ($3 > 0) covered += $2
          } END {print covered, total}' coverage.out)"
          awk -v covered="$covered_statements" -v total="$total_statements" 'BEGIN {
            actual = 100 * covered / total
            if (actual + 1e-9 < 83.0) {
              printf "Go total coverage %.1f%% is below required 83.0%%\n", actual > "/dev/stderr"
              exit 1
            }
          }'

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            coverage_base="$(git -C .. merge-base "origin/$BASE_REF" HEAD)"
          elif [[ -n "$BEFORE_SHA" ]] && git -C .. cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            coverage_base="$BEFORE_SHA"
          else
            coverage_base="$(git -C .. hash-object -t tree /dev/null)"
          fi
          python3 ../scripts/check_go_patch_coverage.py \
            --repository .. \
            --profile coverage.out \
            --base "$coverage_base" \
            --threshold 90 \
            --badge-reference ../docs/badges/go-coverage.svg \
            --badge-tolerance 0.2
      - run: go test -tags=integration -v ./internal/grpc/ -run TestIntegration
      - name: govulncheck
        # Invoke govulncheck directly instead of golang/govulncheck-action: the
        # action runs its own internal actions/checkout, which collides with the
        # already-persisted credentials and fails with
        # `remote: Duplicate header: "Authorization"` (HTTP 400). The repo is
        # already checked out and Go is already set up above.
        #
        # Pinned rather than @latest: every action in this repo is SHA-pinned,
        # and an unpinned `go install` in the security step is the one place an
        # upstream compromise would land straight in CI. The env var carries the
        # version because that is the shape customManagers:githubActionsVersions
        # matches — a bare `@v1.6.0` in the run body would rot unnoticed.
        env:
          # renovate: datasource=go depName=golang.org/x/vuln
          GOVULNCHECK_VERSION: v1.6.0
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...
      - run: go build ./cmd/eebus-bridge/

  docker:
    needs: go
    if: needs.go.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0 # renovate: datasource=github-releases depName=hadolint/hadolint-action
        with:
          dockerfile: eebus-bridge/Dockerfile
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0 # renovate: datasource=github-releases depName=docker/setup-buildx-action
      # Recorded so the log shows whether emulation was even available. No
      # setup-qemu-action here on purpose: since the rootfs stage was folded
      # into the BUILDPLATFORM-pinned builder, no RUN executes outside the
      # native builder and the arm stages are COPY-only. If this job goes red
      # for a missing binfmt handler, that assumption is wrong.
      - name: Record binfmt handlers
        run: ls /proc/sys/fs/binfmt_misc/ 2>/dev/null || echo "no binfmt handlers registered"
      # Previously a plain amd64 `docker build`. A cross-compile break on
      # arm64/armv7 — the platforms the release publishes — was invisible until
      # the tag build, i.e. after the release was already cut.
      - name: Build all release platforms
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0 # renovate: datasource=github-releases depName=docker/build-push-action
        with:
          context: ./eebus-bridge
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=ci-${{ github.sha }}
      # Multi-platform results cannot be loaded into the docker daemon, so the
      # smoke target is rebuilt for amd64 alone. Everything is cached from the
      # step above, so this costs seconds.
      - name: Build amd64 image for the smoke run
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0 # renovate: datasource=github-releases depName=docker/build-push-action
        with:
          context: ./eebus-bridge
          platforms: linux/amd64
          load: true
          tags: eebus-bridge:ci
          cache-from: type=gha
          build-args: |
            BUILD_VERSION=ci-${{ github.sha }}
      - name: Smoke-run the image
        run: bash scripts/smoke-image.sh eebus-bridge:ci

  # Not folded into the docker job: that one is gated on `go`, and the add-on
  # is packaging around a released binary, so a Go change cannot break it and a
  # packaging change does not need the Go build to run first.
  addon:
    needs: changes
    if: needs.changes.outputs.addon == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint add-on Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0 # renovate: datasource=github-releases depName=hadolint/hadolint-action
        with:
          dockerfile: eebus-bridge-addon/Dockerfile
      # Validates config.yaml against the Supervisor's own add-on schema. A key
      # it rejects is otherwise invisible here and only surfaces on a user's
      # box, where the Supervisor logs a warning and silently skips the add-on
      # rather than failing loudly.
      - name: Lint add-on config
        uses: frenck/action-addon-linter@f995494fd84fae6310d23617e66d0e37de4f14eb # v2.21.0 # renovate: datasource=github-releases depName=frenck/action-addon-linter
        with:
          path: ./eebus-bridge-addon

  test:
    # Gated like the go job: a Go- or Dockerfile-only PR cannot break ruff,
    # mypy or pytest, and this matrix spends ~3.5 job-minutes installing
    # homeassistant to prove it. The python filter covers custom_components,
    # pyproject.toml and this workflow, so anything that can affect the result
    # still triggers a run.
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov ruff mypy grpc-stubs homeassistant voluptuous grpcio protobuf pip-audit
      - name: Lint with ruff
        run: ruff check custom_components/
      - name: Type check with mypy
        run: mypy custom_components/eebus
      - name: Audit production dependencies
        run: |
          pip-audit --requirement /dev/stdin <<'EOF'
          grpcio>=1.78.0
          protobuf>=4.25.0
          EOF
      - name: Run tests with coverage
        run: PYTHONPATH=. pytest -m "not cross_language" --cov --cov-report=term-missing -v

  cross-language:
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache-dependency-path: eebus-bridge/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install contract-test dependencies
        run: pip install pytest pytest-asyncio homeassistant voluptuous "grpcio==1.78.0" "protobuf>=4.25.0"
      - name: Run Go/Python contract harness
        run: PYTHONPATH=. pytest -m cross_language -v custom_components/eebus/tests/test_cross_language_contract.py

  proto-governance:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pinned buf
        run: |
          set -euo pipefail
          source proto-tools.env
          mkdir -p .cache/proto-tools/bin
          GOBIN="$PWD/.cache/proto-tools/bin" go install "github.com/bufbuild/buf/cmd/buf@v${BUF_VERSION}"
      - name: Buf lint
        run: .cache/proto-tools/bin/buf lint
      - name: Buf breaking check
        if: github.event_name == 'pull_request'
        run: .cache/proto-tools/bin/buf breaking --against ".git#branch=origin/${{ github.base_ref }},subdir=eebus-bridge/proto"
      - name: Check scoped cardinality waivers
        if: github.event_name == 'pull_request'
        run: python scripts/check_proto_cardinality.py "origin/${{ github.base_ref }}"
      - name: Regenerate proto stubs
        run: PYTHON_BIN=python bash generate_proto.sh
      - name: Check for stub drift
        run: bash scripts/check_generated_drift.sh
      - name: Check proto_stubs exports
        run: PYTHONPATH=. python scripts/check_proto_stubs_exports.py
      - name: Check v1 governance rules
        run: python scripts/check_proto_governance.py

  
