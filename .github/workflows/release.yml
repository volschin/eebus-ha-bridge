name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  create-release:
    # Gated on the image so a failed or unhealthy build cannot produce a
    # published release. HACS updates users from published releases, so a
    # release without a working image strands everyone who upgrades on it.
    needs: build-verified-addon
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        # HACS reads published releases, not tags. Without this the integration
        # never sees a new version even though the tag and image exist.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes --latest --verify-tag

  publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source and version
        run: |
          set -euo pipefail
          python3 scripts/check_addon_version.py "${GITHUB_REF_NAME}"
          git fetch --no-tags origin main
          release_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if ! git merge-base --is-ancestor "${release_commit}" origin/main; then
            echo "::error::release tag ${GITHUB_REF_NAME} does not point to a commit on main"
            exit 1
          fi

      # No setup-qemu-action: the builder stage is pinned to BUILDPLATFORM and
      # the arm stages are COPY-only, so nothing executes under emulation. CI's
      # docker job builds the same three platforms without it on every PR, which
      # is where a wrong assumption here would surface first.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0 # renovate: datasource=github-releases depName=docker/setup-buildx-action

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 # renovate: datasource=github-releases depName=docker/login-action
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 # renovate: datasource=github-releases depName=docker/metadata-action
        with:
          images: ghcr.io/${{ github.repository_owner }}/eebus-bridge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Built and smoke-run before anything is pushed. v0.13.0 shipped a
      # startup panic with every gate green because no gate ever started the
      # binary; the image was published and deployed before anyone noticed.
      # Multi-platform results cannot be loaded into the docker daemon, so the
      # smoke target is amd64-only — a startup panic is not arch-specific, and
      # the other two platforms are covered by the build succeeding.
      - name: Build amd64 image for the smoke run
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0 # renovate: datasource=github-releases depName=docker/build-push-action
        with:
          context: ./eebus-bridge
          platforms: linux/amd64
          load: true
          tags: eebus-bridge:smoke
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
          cache-from: type=gha

      - name: Smoke-run the image
        run: bash scripts/smoke-image.sh eebus-bridge:smoke

      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0 # renovate: datasource=github-releases depName=docker/build-push-action
        with:
          context: ./eebus-bridge
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          # Provenance was already attached by the action's default, but the
          # default mode differs between event types and the published
          # attestation reported completeness.resolvedDependencies=false. Pin
          # max so every release records the full build materials regardless of
          # how it was triggered. SBOM was not attached at all before this.
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sign-image:
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 # renovate: datasource=github-releases depName=docker/login-action
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 # renovate: datasource=github-releases depName=sigstore/cosign-installer

      - name: Sign image digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/eebus-bridge@${{ needs.publish-image.outputs.digest }}
        run: cosign sign --yes "${IMAGE}"

      - name: Verify image signature
        env:
          CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/eebus-bridge@${{ needs.publish-image.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}"

  build-verified-addon:
    needs: sign-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build add-on from verified release image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          docker build \
            --platform linux/amd64 \
            --build-arg "BUILD_VERSION=${version}" \
            --tag eebus-bridge-addon:release-verify \
            eebus-bridge-addon
          docker run --rm --entrypoint /bin/sh \
            eebus-bridge-addon:release-verify -c \
            'test -x /usr/local/bin/eebus-bridge &&
             test ! -e /usr/local/bin/cosign &&
             test ! -e /usr/local/bin/regctl &&
             test ! -e /usr/local/bin/fetch-verified-bridge'
