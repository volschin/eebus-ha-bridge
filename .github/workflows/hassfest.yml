name: Hassfest

# hassfest validates manifest.json and the integration's file layout, so only
# custom_components (and this workflow) can change its verdict. Go- and
# Dockerfile-only PRs no longer trigger it. (Duplicated per event: Actions does
# not expand YAML anchors.)
on:
  push:
    branches: [main]
    paths:
      - 'custom_components/**'
      - '.github/workflows/hassfest.yml'
  pull_request:
    branches: [main]
    paths:
      - 'custom_components/**'
      - '.github/workflows/hassfest.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@ab22029681aa532bfe7de5774a9972d67bfbd2c0 # master
